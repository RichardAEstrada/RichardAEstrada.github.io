<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#24132f">
<title>Richard Estrada | TRP Infrastructure Services</title>
<style>
:root{--purple:#4d1d7d;--orange:#ff6418;--ink:#151118;--muted:#766f7b;--paper:#fff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
background:radial-gradient(circle at 50% 0,#54207e 0,#24132f 38%,#0e0d10 100%);color:var(--ink)}
.card{width:min(430px,100%);background:rgba(255,255,255,.98);border-radius:28px;overflow:hidden;
box-shadow:0 30px 80px rgba(0,0,0,.38);border:1px solid rgba(255,255,255,.18)}
.brand{padding:30px 28px 23px;text-align:center;background:#fff}
.logo{width:178px;max-width:60%;height:auto}
.orange{height:7px;background:var(--orange)}
.main{padding:30px 28px 27px;text-align:center}
.kicker{font-size:12px;font-weight:800;letter-spacing:.16em;color:var(--purple);text-transform:uppercase}
h1{font-size:32px;line-height:1.05;margin:9px 0 7px;letter-spacing:-.03em}
.title{font-size:16px;color:var(--muted);font-weight:650;margin-bottom:26px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:26px}
.action{display:flex;flex-direction:column;align-items:center;gap:7px;text-decoration:none;color:#fff;
background:var(--purple);padding:14px 7px;border-radius:16px;font-size:12px;font-weight:800}
.action:nth-child(2){background:#312638}.action:nth-child(3){background:var(--orange)}
.icon{font-size:21px;line-height:1}
.info{text-align:left;border-top:1px solid #ece8ef;padding-top:20px}
.row{display:flex;gap:13px;align-items:flex-start;padding:9px 0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--orange);margin-top:6px;flex:0 0 auto}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#938b96;font-weight:800}
.value{font-size:15px;margin-top:2px;word-break:break-word}
.value a{color:inherit;text-decoration:none}
.footer{padding:16px 28px 22px;text-align:center;color:#99919c;font-size:11px}
</style>
</head>
<body>
<main class="card">
  <div class="brand">
    <img class="logo" src="https://trpinfrastructure.com/wp-content/uploads/2026/01/favicon.png" alt="TRP Infrastructure Services">
  </div>
  <div class="orange"></div>
  <section class="main">
    <div class="kicker">TRP Infrastructure Services</div>
    <h1>Richard Estrada</h1>
    <div class="title">SR. EHS Specialist</div>
    <div class="actions">
      <a class="action" href="tel:+13613289841"><span class="icon">☎</span><span>CALL</span></a>
      <a class="action" href="mailto:richarde@trpinfra.com"><span class="icon">✉</span><span>EMAIL</span></a>
      <a class="action" href="Richard-Estrada.vcf" download><span class="icon">＋</span><span>SAVE CONTACT</span></a>
    </div>
    <div class="info">
      <div class="row"><span class="dot"></span><div><div class="label">Phone</div><div class="value"><a href="tel:+13613289841">(361) 328-9841</a></div></div></div>
      <div class="row"><span class="dot"></span><div><div class="label">Email</div><div class="value"><a href="mailto:richarde@trpinfra.com">richarde@trpinfra.com</a></div></div></div>
    </div>
  </section>
  <div class="footer">TRP Infrastructure Services</div>
</main>
</body>
</html>
